<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hug Day</title>
  <style>
    body {
      font-family: 'Kalam', cursive;
      text-align: center;
      background-color: #fff8e1;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }
    .envelope {
      cursor: pointer;
      font-size: 50px;
      color: #ff8f00;
      transition: transform 0.3s ease;
    }
    .envelope:hover {
      transform: scale(1.1);
    }
    .hugs {
      display: none;
      font-size: 30px;
      color: #ff6f00;
      margin-top: 20px;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .hug-animation {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .hug-animation span {
      position: absolute;
      display: block;
      font-size: 100px;
      animation: hug 5s linear infinite;
    }
    @keyframes hug {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(100vw); }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="envelope" onclick="revealHugs()">💌</div>
  <div class="hugs">
    Dear Tashu, Wishing you<br>
	Happy Hug day!!!<br>
    Sending You Infinite Hugs! 🤗<br>
<img class="animation" id="animation" src="https://media.giphy.com/media/9d3LQ6TdV2Flo8ODTU/giphy.gif?cid=790b7611wyrax60kfx4ohjlu5lzbltqtf79i82roc8bmhijz&ep=v1_gifs_search&rid=giphy.gif&ct=g" alt="Hug">
  </div>
  <div class="hug-animation">
    <!-- Hug animation will be generated here -->
  </div>

  <script>
    function revealHugs() {
      const envelope = document.querySelector('.envelope');
      const hugs = document.querySelector('.hugs');
      const hugAnimation = document.querySelector('.hug-animation');

      envelope.style.display = 'none';
      hugs.style.display = 'block';
      hugAnimation.style.display = 'block';

      // Generate hug animation
      for (let i = 0; i < 20; i++) {
        const hug = document.createElement('span');
        hug.innerHTML = '❤️';
        hug.style.top = Math.random() * 100 + 'vh';
        hug.style.animationDuration = Math.random() * 3 + 2 + 's';
        hugAnimation.appendChild(hug);
      }
    }
  </script>
</body>
</html>
